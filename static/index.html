<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="voice-loop">
<meta name="theme-color" content="#111111">
<!-- アイコンは spike/make_icon.py で作る（自分の画像に替えるときも同じスクリプトに渡す） -->
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>voice-loop</title>
<style>
  :root { --bg:#111; --fg:#eee; --mute:#888; --rec:#e0443e; --ok:#3ea66b; --btn:#2a2a2a; --me:#1f3a5f; --ai:#1e1e1e; --line:#2f2f2f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, "Hiragino Sans", sans-serif; display:flex; flex-direction:column; height:100dvh; }
  button, select { touch-action: manipulation; }
  #log { flex:1; overflow-y:auto; padding:12px 12px 4px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:94%; padding:10px 12px; border-radius:14px; word-break:break-word; }
  .msg.me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; white-space:pre-wrap; }
  .msg.ai { align-self:flex-start; background:var(--ai); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.ai.speaking { border-color: var(--ok); }
  .msg.pending { opacity:.6; }
  .sys { align-self:center; color:var(--mute); font-size:12px; text-align:center; }
  /* エージェントの返信（Markdown） */
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:.5em 0; }
  .md h1, .md h2, .md h3, .md h4 { margin:.9em 0 .4em; line-height:1.35; }
  .md h1 { font-size:1.2em; } .md h2 { font-size:1.1em; } .md h3, .md h4 { font-size:1em; }
  .md ul, .md ol { margin:.4em 0; padding-left:1.4em; }
  .md li { margin:.15em 0; }
  .md code { font:13px/1.5 ui-monospace, Menlo, monospace; background:#2b2b2b; padding:.1em .35em; border-radius:4px; }
  .md pre { background:#0b0b0b; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; margin:.6em 0; }
  .md pre code { background:none; padding:0; }
  .md .tw { overflow-x:auto; margin:.6em 0; }
  .md table { border-collapse:collapse; font-size:14px; }
  .md th, .md td { border:1px solid #3a3a3a; padding:4px 8px; text-align:left; vertical-align:top; }
  .md th { background:#262626; }
  .md blockquote { margin:.5em 0; padding-left:.8em; border-left:3px solid #444; color:#bbb; }
  .md hr { border:none; border-top:1px solid var(--line); margin:.8em 0; }
  .md a { color:#7fb4ff; }
  #bar { flex:none; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); background:#161616; border-top:1px solid #262626; display:flex; flex-direction:column; gap:8px; }
  #status { color:var(--mute); font-size:13px; min-height:1.6em; display:flex; align-items:center; gap:6px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mute); flex:none; }
  .dot.on { background:var(--ok); }
  #statusText { flex:1; min-width:0; }
  #reload { flex:none; border:none; background:none; color:var(--mute); font-size:16px; line-height:1; padding:4px 6px; margin:-4px -6px; } /* 目立たないように小さく、押せる広さは少し持たせる */
  /* 読み上げの切り替え。読み上げの途中でもすぐ押せるよう、↻ より押せる広さを持たせる。切っている間は色をつけて、文字だけと分かるようにする */
  #mute { flex:none; border:none; border-radius:8px; background:none; font-size:17px; line-height:1; padding:6px 9px; margin:-6px 0; opacity:.45; }
  #mute[aria-pressed="true"] { opacity:1; background:#5a1f1d; }
  /* 通知（🔔）・頼んだ件（📋）・いまの状況（💡）。🔇 と同じ大きさ。入っている・開いている間は色をつける */
  #bell, #tasksBtn, #sitBtn { flex:none; border:none; border-radius:8px; background:none; font-size:17px; line-height:1; padding:6px 9px; margin:-6px 0; opacity:.45; }
  #bell[aria-pressed="true"] { opacity:1; background:#1f4a32; }
  #tasksBtn[aria-pressed="true"] { opacity:1; background:#2a2f45; }
  #sitBtn[aria-pressed="true"] { opacity:1; background:#3a3420; }
  #tap, #hubStart { display:none; margin-left:auto; border:none; border-radius:8px; background:var(--ok); color:#fff; font-size:13px; padding:4px 10px; }
  button:disabled, input:disabled { opacity:.35; }
  .row { display:flex; gap:8px; }
  select { flex:1; min-width:0; font-size:13px; padding:8px; background:var(--btn); color:var(--fg); border:1px solid #333; border-radius:8px; }
  #agent { flex:2; }
  #talk { flex:3; height:64px; font-size:18px; border:none; border-radius:14px; background:var(--btn); color:var(--fg); }
  #talk.rec { background:var(--rec); }
  #stop { flex:1; height:64px; font-size:15px; border:none; border-radius:14px; background:var(--btn); color:var(--fg); }
  #typed { flex:1; min-width:0; font-size:16px; padding:9px 12px; background:var(--btn); color:var(--fg); border:1px solid #333; border-radius:10px; }
  #send { width:64px; font-size:14px; border:none; border-radius:10px; background:var(--btn); color:var(--fg); }
  [hidden] { display:none !important; }
  /* 承認で止まっているセッション（画面の上に並べる） */
  #asks { flex:none; max-height:45dvh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:#161616; border-bottom:1px solid #262626; }
  #asks:empty { display:none; }
  .ask { display:flex; flex-direction:column; gap:6px; padding:8px 10px; border:1px solid #5a4a1f; border-radius:10px; background:#1c1910; }
  .ask .head { font-size:13px; color:#e6c36a; }
  .ask pre { margin:0; max-height:6em; overflow:auto; font:12px/1.5 ui-monospace, Menlo, monospace; color:#ccc; white-space:pre-wrap; word-break:break-all; }
  .ask button { flex:1; height:44px; font-size:15px; border:none; border-radius:10px; color:#fff; }
  .ask .allow { background:var(--ok); } .ask .allow.warn { background:var(--rec); } .ask .deny { background:var(--btn); }
  /* 頼んだ件（📋 で開く） */
  #tasks { flex:none; max-height:45dvh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:#14161d; border-bottom:1px solid #262a38; }
  #tasks .top { display:flex; align-items:center; font-size:13px; color:#aab4d6; }
  #tasks .top span { flex:1; }
  #tasks .top button { border:none; background:none; color:var(--mute); font-size:15px; padding:2px 6px; }
  .task { display:flex; flex-direction:column; gap:2px; padding:6px 10px; border:1px solid #2a2f45; border-radius:10px; background:#181b25; font-size:13px; }
  .task .st { font-size:12px; color:#9fb0e0; }
  .task.active .st { color:#e6c36a; } .task.done .st { color:var(--ok); } .task.bad .st { color:#e07a74; }
  .task .what, .task .note { color:#bbb; font-size:12px; overflow-wrap:anywhere; }
  /* いまの状況（💡 で開く） */
  #situation { flex:none; max-height:55dvh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:#17150f; border-bottom:1px solid #3a3420; }
  #situation .top { display:flex; align-items:center; font-size:13px; color:#d8c88f; }
  #situation .top span { flex:1; }
  #situation .top button { border:none; background:none; color:var(--mute); font-size:15px; padding:2px 6px; }
  #sitBody { display:flex; flex-direction:column; gap:6px; }
  #sitBody h4 { margin:6px 0 0; font-size:12px; font-weight:600; color:#c9b77a; }
  .sitHead { display:flex; align-items:center; gap:8px; font-size:12px; color:#bbb; }
  .sitHead span { flex:1; }
  .sitHead button, #factForm button { border:none; border-radius:8px; background:#3a3420; color:var(--fg); font-size:13px; padding:5px 10px; }
  .topic { display:flex; flex-direction:column; gap:2px; padding:6px 10px; border:1px solid #3a3420; border-radius:10px; background:#1d1a12; font-size:13px; }
  .topic .now, .topic .nx { color:#ccc; font-size:12px; overflow-wrap:anywhere; }
  .sitMeta { color:var(--mute); font-size:12px; overflow-wrap:anywhere; }
  .sitMeta.bad { color:#e07a74; }
  .prop { display:flex; flex-direction:column; gap:4px; padding:8px 10px; border:1px solid #6b5a2a; border-radius:10px; background:#241f12; font-size:13px; }
  .prop .text { overflow-wrap:anywhere; white-space:pre-wrap; }
  .prop .risky { color:#e0a874; font-size:12px; }
  .prop .acts { display:flex; flex-wrap:wrap; gap:6px; }
  .prop .acts button { border:none; border-radius:8px; background:#3a3420; color:var(--fg); font-size:13px; padding:6px 12px; }
  .prop .acts button.go { background:#6b5a2a; }
  .prop .acts button.sure { background:#b8862e; color:#111; font-weight:600; }
  /* Hermes の手順の書き足し（承認待ち）。提案と見分けるため色を変える */
  .prop.hsk { border-color:#4d5a80; background:#161b29; }
  .prop.hsk .go { background:#4d5a80; }
  pre.diff { margin:4px 0 0; max-height:40dvh; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; line-height:1.45; color:#cfd6e6; background:#0f121b; border-radius:6px; padding:6px 8px; }
  #sitNote { font-size:12px; color:#d8c88f; overflow-wrap:anywhere; }
  #sitNote.bad { color:#e07a74; }
  #situation details summary { font-size:12px; color:#c9b77a; cursor:pointer; }
  .fact { display:flex; align-items:flex-start; gap:6px; font-size:13px; overflow-wrap:anywhere; }
  .fact span { flex:1; min-width:0; }
  .fact button { flex:none; border:none; background:none; color:var(--mute); font-size:15px; padding:0 6px; }
  #factForm { display:flex; gap:6px; }
  #factText { flex:1; min-width:0; font-size:16px; padding:6px 10px; background:var(--btn); color:var(--fg); border:1px solid #333; border-radius:8px; }
  /* PC（横幅 1100px 以上で body に wide）。3 列: 左にセッションの一覧と頼んだ件、真ん中に会話、右に記録（記憶・状況）。スマホの幅では何も変えない。
     左の縦の色の帯は状態を表す（セッション・頼んだ件・承認のカードで同じ色）: 黄＝あなた待ち、青＝動いている、緑＝終わった、赤＝切れた・失敗、灰＝それ以外。
     箱で囲むのは押して決めるもの（承認・提案・足す欄）だけにして、一覧は線で区切る */
  #side, #rec { display:none; }
  body.wide {
    --w-bg:#121316; --w-col:#17181b; --w-hover:#1d1f23; --w-sel:#25282e; --w-rule:#272a2f; --w-field:#1b1d21; --w-line:#363a41;
    --w-t1:#ececec; --w-t2:#b4b8bf; --w-t3:#80858d; --w-go:#2b5285;
    --s-wait:#e3b341; --s-run:#6ea8fe; --s-done:#56b67f; --s-bad:#e5736b; --s-idle:#5a5f67;
    background:var(--w-bg);
    display:grid; grid-template-columns:clamp(260px, 20vw, 320px) minmax(0,1fr) clamp(340px, 26vw, 460px); grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"side asks rec" "side log rec" "side bar rec"; }
  body.wide button { cursor:pointer; }
  body.wide button:focus-visible, body.wide [role="button"]:focus-visible, body.wide select:focus-visible { outline:2px solid var(--s-run); outline-offset:1px; }
  body.wide #side { grid-area:side; display:flex; flex-direction:column; min-height:0; background:var(--w-col); border-right:1px solid var(--w-rule); }
  body.wide #rec { grid-area:rec; display:flex; flex-direction:column; min-height:0; background:var(--w-col); border-left:1px solid var(--w-rule); }
  body.wide #rec[data-tab="mem"] #situation, body.wide #rec[data-tab="sit"] #memPanel { display:none !important; }
  body.wide #sitBtn, body.wide #tasksBtn, body.wide #tasksClose, body.wide #sitClose { display:none !important; }
  /* 列の見出し（セッション・頼んだ件）。数は細く */
  .side-h, .tgh { display:flex; align-items:baseline; gap:8px; padding:16px 16px 8px; font-size:14px; font-weight:600; color:var(--w-t1); }
  .side-h .n, .tgh .n { font-weight:400; font-size:12px; color:var(--w-t3); font-variant-numeric:tabular-nums; }
  .tgs { padding:12px 10px 4px; font-size:12px; color:var(--w-t3); }
  /* セッションの一覧。1 行目に場所（フォルダ）、2 行目に題 */
  #sessions { flex:none; max-height:45%; overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding:0 8px 12px; border-bottom:1px solid var(--w-rule); }
  .sess { position:relative; display:flex; align-items:center; gap:8px; text-align:left; border:none; border-radius:6px; background:none; color:var(--w-t2); font:inherit; font-size:13px; line-height:1.35; padding:6px 10px 6px 16px; }
  .sess::before, body.wide .task::before { content:""; position:absolute; left:5px; top:8px; bottom:8px; width:3px; border-radius:2px; background:var(--lane, transparent); }
  .sess:hover { background:var(--w-hover); }
  .sess.on { background:var(--w-sel); }
  .sess.hub { margin-bottom:8px; } .sess.hub::after { content:""; position:absolute; left:8px; right:8px; bottom:-5px; border-bottom:1px solid var(--w-rule); }
  .sess.blocked { --lane:var(--s-wait); } .sess.working { --lane:var(--s-run); }
  .sess .nm { flex:1; min-width:0; display:flex; flex-direction:column; }
  .sess .pj { color:var(--w-t1); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .sep { display:none; }
  .sess .tt { font-size:12px; color:var(--w-t3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .st { flex:none; font-size:11px; color:var(--w-t3); }
  .sess.blocked .st { color:var(--s-wait); } .sess.working .st { color:var(--s-run); } .sess.done .st { color:var(--s-done); }
  /* 頼んだ件。指示の文は 2 行で切り、押すと全文 */
  body.wide #tasks { flex:1; min-height:0; max-height:none; gap:0; padding:0 8px 16px; border-bottom:none; background:none; }
  body.wide #tasks .top { display:none; }
  body.wide #taskList { display:flex; flex-direction:column; gap:2px; }
  body.wide .task { position:relative; gap:2px; padding:8px 10px 8px 16px; border:none; border-radius:6px; background:none; font-size:13px; line-height:1.5; }
  body.wide .task[aria-expanded]:hover { background:var(--w-hover); }
  body.wide .task .tl { display:flex; gap:8px; font-size:12px; }
  body.wide .task .st { flex:1; color:var(--lane, var(--w-t3)); }
  body.wide .task .tm { color:var(--w-t3); font-variant-numeric:tabular-nums; }
  body.wide .task .pj { color:var(--w-t1); font-weight:600; } body.wide .task .tt { color:var(--w-t2); }
  body.wide .task .what { color:var(--w-t3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  body.wide .task.open .what { display:block; }
  body.wide .task .note { color:var(--w-t3); }
  body.wide .task.ended .pj, body.wide .task.ended .tt { color:var(--w-t2); font-weight:400; }
  [data-lane="wait"] { --lane:var(--s-wait); } [data-lane="run"] { --lane:var(--s-run); } [data-lane="done"] { --lane:var(--s-done); } [data-lane="bad"] { --lane:var(--s-bad); }
  /* 真ん中: 承認のカード・会話・入力。ハブの返事は吹き出しにせず、読みやすい幅の本文として出す */
  body.wide #asks { grid-area:asks; padding:12px 32px 10px; background:var(--w-bg); border-bottom:1px solid var(--w-rule); }
  body.wide .ask { border:none; border-left:3px solid var(--s-wait); border-radius:6px; background:#1c1910; padding:10px 14px; }
  body.wide .ask button { height:36px; font-size:14px; border-radius:8px; }
  body.wide #log { grid-area:log; min-height:0; padding:24px 32px 12px; gap:20px; }
  body.wide .msg.ai { max-width:46em; background:none; border:none; border-left:2px solid var(--w-rule); border-radius:0; padding:2px 0 2px 18px; font-size:15px; line-height:1.8; color:var(--w-t1); }
  body.wide .msg.ai.speaking { border-left-color:var(--ok); }
  body.wide .msg.me { max-width:min(70%, 38em); padding:8px 14px; border-radius:14px 14px 4px 14px; line-height:1.7; }
  body.wide .lead { font-weight:700; color:#fff; }
  body.wide .sys { max-width:46em; color:var(--w-t3); }
  /* 入力。文字の欄を主に、話す・停止は小さく、相手と声と同じ行に */
  body.wide #bar { grid-area:bar; display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr) auto auto; grid-template-areas:"st st st st" "ty ty ty ty" "ag vo tk sb";
    gap:8px; padding:10px 32px 16px; background:var(--w-bg); border-top:1px solid var(--w-rule); }
  body.wide #bar > .row:not(#typedForm) { display:contents; }
  body.wide #status { grid-area:st; } body.wide #typedForm { grid-area:ty; }
  body.wide #agent { grid-area:ag; } body.wide #speaker { grid-area:vo; } body.wide #talk { grid-area:tk; } body.wide #stop { grid-area:sb; }
  body.wide #agent, body.wide #speaker { height:36px; padding:0 10px; background:var(--w-field); border-color:var(--w-rule); color:var(--w-t2); }
  body.wide #talk, body.wide #stop { height:36px; padding:0 16px; font-size:14px; border-radius:8px; border:1px solid var(--w-line); background:var(--w-field); color:var(--w-t1); }
  body.wide #talk { min-width:9.5em; } body.wide #talk.rec { background:var(--rec); border-color:var(--rec); }
  body.wide #typed { height:46px; font-size:15px; padding:0 14px; background:var(--w-field); border-color:var(--w-line); }
  body.wide #typed:focus { outline:none; border-color:var(--s-run); }
  body.wide #send { width:auto; height:46px; padding:0 22px; background:var(--w-go); color:#fff; font-weight:600; }
  /* 右: 記録のタブ */
  #recTabs { display:flex; gap:22px; padding:0 20px; border-bottom:1px solid var(--w-rule); }
  #recTabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--w-t3); font-size:14px; font-weight:600; padding:14px 0 10px; margin-bottom:-1px; }
  #recTabs button[aria-selected="true"] { color:var(--w-t1); border-bottom-color:var(--w-t1); }
  #recTabs .n { margin-left:6px; font-size:11px; background:#6b5a2a; color:#fff; border-radius:8px; padding:0 6px; }
  body.wide #situation { flex:1; min-height:0; max-height:none; padding:12px 20px 24px; gap:8px; border-bottom:none; background:none; }
  body.wide #situation .top { font-size:12px; color:var(--w-t3); }
  body.wide #sitBody h4 { margin:12px 0 2px; font-size:13px; color:var(--w-t1); }
  body.wide .topic { border:none; border-top:1px solid var(--w-rule); border-radius:0; background:none; padding:10px 0; }
  body.wide .sitHead { color:var(--w-t3); }
  body.wide .sitHead button:not(.sure) { border:1px solid var(--w-line); background:none; color:var(--w-t2); font-size:12px; padding:4px 10px; }
  body.wide .sitHead button.sure { background:#b8862e; color:#111; font-weight:600; }
  /* 記憶。字数は上限との棒でも出す（8 割で黄、95% で赤）。長い項目は 4 行で切り、直す・消すはマウスを載せた項目だけに出す */
  #memPanel { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:14px 20px 24px; }
  #memPanel > .sitMeta { line-height:1.6; }
  .memT { display:flex; flex-direction:column; }
  .memT h4 { display:flex; align-items:baseline; gap:4px; margin:10px 0 6px; font-size:14px; font-weight:600; color:var(--w-t1); }
  .memT h4 .file { font-size:12px; font-weight:400; color:var(--w-t3); }
  .memT h4 .use { margin-left:auto; font-size:12px; font-weight:400; color:var(--w-t2); font-variant-numeric:tabular-nums; }
  .meter { height:4px; margin-bottom:4px; border-radius:2px; background:var(--w-rule); overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--s-run); } .meter.near i { background:var(--s-wait); } .meter.full i { background:var(--s-bad); }
  .mem { position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:10px 0; border-top:1px solid var(--w-rule); font-size:13.5px; line-height:1.7; color:#dcdde0; }

// 行の頭の【見出し】に印を付ける（PC の幅で太く出す。スマホでは見た目を変えない）。文字の節を分けるだけで、HTML は組み立てない

const curAgent = () => agents.find(a => a.pane === $('agent').value);

  if (!msgs.length) sys('このセッションにはまだ会話がありません');

// ---------- セッション一覧 ----------

const WANT = 'vl.agentKey3';

let setupChecked = false; // 開いてから一度は、準備の残りを確かめたか
function applyTarget() {

  $('talk').disabled = $('send').disabled = !ok || !linked() || !$('speaker').value;
  const shown = $('statusText').textContent;
  if (!ok && linked()) setStatus('話し相手を選んでください');

}
async function loadAgents() {
  let list; try { list = await (await fetch('/api/agents')).json(); } catch { return; }
  const sig = JSON.stringify(list.map(a => [a.pane, a.key, a.title, a.status, a.hermes ? a.session : '']));  // Hermes は会話の名前が変わる（💡 に出す）

    if (saved === null) localStorage.setItem(WANT, want);

// 使い始めの準備が残っていれば、次にやることを順に出す（初回の案内）
async function showSetup(seq) {
  let d; try { d = await (await fetch('/api/doctor')).json(); } catch { return; }
  const todo = d.checks.filter(c => !c.ok && !c.optional);
  if (seq !== loadSeq || !todo.length) return;

$('agent').onchange = () => { localStorage.setItem(WANT, curKey()); shownPane = $('agent').value; applyTarget(); setStatus(linked() ? '準備できました' : UNREACHABLE); loadThread(); };

// ---------- 承認で止まっているセッションへの返答（ボタン） ----------
// 話し相手（ハブなど）の画面のまま、承認で止まっているセッションをすべて画面の上に並べる（名前・聞かれている中身・許可（今回だけ）・断る）。
// ボタンを出すのは、本体が承認の画面と見分けたときだけ。それ以外は中身を見せるだけにする（画面の文字の読み取りは揺れるので、出さないほうに倒す）。

const ASK_HEAD = {
  permission: '承認を待っています', question: '質問で止まっています。端末かハブで答えてください',
  trust: 'フォルダを信頼するか聞いています。端末で答えてください', unknown: '止まっています。端末で答えてください',

  gone: 'セッションが入れ替わっていました', not_permission: '承認の画面と見分けられませんでした', trust: 'フォルダの信頼は端末で答えてください',

async function loadAsks() {

  $('hubStart').disabled = true; setStatus('ハブを起動しています…（20秒ほど）');

async function loadSpeakers() {

  for (const s of sp) { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); }

  if (saved && sp.some(s => String(s.id) === saved)) sel.value = saved; else if (def) sel.value = def.id; // 覚えている声が無い（エンジンを替えた直後など）なら既定の声
  hello(); applyTarget(); // つながったあとで一覧が届いたときも、選んでいる声をサーバーに知らせ、送れるようにする
}
// ハブからの報告を、選んでいる声で届けてもらう。読み上げを切っていれば、音声を送らないでもらう
// 画面が見えているかも知らせる（見えている画面があれば、本体はプッシュ通知を送らない）
const hello = (visible = !document.hidden) => { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'hello', speaker: $('speaker').value, voice: !muted, visible })); } catch {} };

// ---------- 再生 ----------

function silentWav() {

const player = new Audio(); player.preload = 'auto';

  curUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  player.src = curUrl;
  player.play().then(() => {

  ed.onclick = () => { memEdits.set(e.v, { target: t, text: e.text }); drawMemory(); const ta = $('memPanel').querySelector(`.mem[data-v="${e.v}"] textarea`); if (ta) ta.focus(); };
  if ((memConfirm.get(e.v) || 0) > Date.now()) { rm.className = 'sure'; rm.textContent = 'この項目を消す'; c.classList.add('confirm'); }
  rm.onclick = async () => {
    if ((memConfirm.get(e.v) || 0) <= Date.now()) {  // 1段目: 確かめを出す。10 秒で戻る
      memConfirm.set(e.v, Date.now() + 10000); rm.className = 'sure'; rm.textContent = 'この項目を消す'; c.classList.add('confirm');
      setTimeout(() => { if ((memConfirm.get(e.v) || 0) <= Date.now()) { memConfirm.delete(e.v); drawMemory(); } }, 10050); return;
    }
    memConfirm.delete(e.v); rm.disabled = ed.disabled = true; rm.textContent = '消しています…';
    await memWrite('remove', { target: t, v: e.v }, '消しました');
  };
  acts.append(ed, rm); c.appendChild(acts);
  return c;
}
function memOrphan(t, v, ed) {  // 直す途中のまま、項目が見当たらなくなった（Hermes が書き換えた・消した、またはファイルを読めない）。文は残し、足すか捨てるかを選んでもらう
  const c = node('div', 'mem editing'); c.dataset.v = v;
  c.appendChild(node('div', 'sitMeta bad', '直している途中の項目が、いまの記憶に見当たりません（Hermes が書き換えた・消した、またはファイルを読めない）。文はここに残してあります。新しい項目として足すか、捨ててください'));
  const ta = node('textarea'); ta.value = ed.text; ta.oninput = () => { ed.text = ta.value; };
  const row = node('div', 'acts'), add = node('button', 'go', '新しい項目として足す'), drop = node('button', null, '捨てる');
  add.onclick = async () => { add.disabled = drop.disabled = true; await memWrite('add', { target: t, content: ed.text }, '足しました', () => memEdits.delete(v)); };
  drop.onclick = () => { memEdits.delete(v); drawMemory(); };
  row.append(add, drop); c.append(ta, row);
  return c;
}
function memAddForm() {
  const f = node('div', 'memAdd'), sel = node('select'), ta = node('textarea'), b = node('button', 'go', '足す');
  f.appendChild(node('div', 'ttl', '記憶を足す'));
  for (const [k, v] of Object.entries(MEM_T)) { const o = node('option', null, v); o.value = k; sel.appendChild(o); }
  sel.value = memDraft.target; sel.onchange = () => { memDraft.target = sel.value; };
  ta.placeholder = '覚えてほしいこと（例: 録音の「山だ」は山田のこと）'; ta.value = memDraft.text;
  ta.oninput = () => { memDraft.text = ta.value; };
  b.onclick = async () => {
    if (!ta.value.trim()) return;
    b.disabled = true; b.textContent = '足しています…';
    await memWrite('add', { target: sel.value, content: ta.value }, '足しました', () => { memDraft.text = ''; });
  };
  const row = node('div', 'acts'); row.appendChild(b);
  f.append(sel, ta, row);
  return f;
}
WIDE.addEventListener('change', applyWide);
applyWide();

// ---------- 通信 ----------
// 本体に届かない間は案内を出してつなぎ直し続け、届いたらページを読み込み直さずに、その場で一覧・声・会話を取り直す。
// 案内は届かない先を名指ししない（本体が Mac とは限らない）
const UNREACHABLE = '接続できません。接続を確かめてください';
let away = false, retry = null;
function connect() {
  clearTimeout(retry);
  if (ws && ws.readyState <= 1) return; // つなぎに行っている途中か、もうつながっている
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  const sock = ws, giveUp = setTimeout(() => { if (sock.readyState === 0) sock.close(); }, 5000); // 通信が止まって待たされるときは見切る
  ws.onopen = () => {
    clearTimeout(giveUp); $('conn').classList.add('on'); setStatus('準備できました'); applyTarget(); hello(); clog('connected ' + navigator.userAgent);
    if (away || !agentsSig || !$('speaker').options.length) { away = false; catchUp(); } // 起動時に読めなかったものも取り直す
  };
  ws.onclose = () => {
    clearTimeout(giveUp); if (sock !== ws) return;
    if (rec && rec.state === 'recording') stopRec(); // 話している途中なら止めてマイクを離す（送らずに捨てる）
    $('conn').classList.remove('on'); away = true; applyTarget(); setStatus(UNREACHABLE); retry = setTimeout(connect, 2000);
  };
  ws.onmessage = async ev => {
    if (ev.data instanceof ArrayBuffer) { enqueue(ev.data); return; }
    const m = JSON.parse(ev.data);
    const here = !m.pane || m.pane === $('agent').value;
    if (m.type === 'status') setStatus(m.text);
    else if (m.type === 'transcript') { if (here) { bubble('me', m.text, 'pending'); localPush('me', m.text); } setStatus('エージェントに送りました。考え中…'); }
    else if (m.type === 'reply') {
      if (!here) { if (m.report) sys('ハブから報告が届きました: ' + m.about + (m.saved === false ? '（記録に書けなかったので、ハブの履歴には出ません）' : '（ハブを選ぶと読めます）')); return; } // report = 頼んだ件についての、ハブからの自発的な報告
      if (m.saved === false) { bubble('ai', m.text); sys('⚠ このやり取りは記録に書けませんでした（開き直すと消えます。本体のログを見てください）'); } // 描き直すと消えるので、そのまま足す
      else {
        await loadThread(); // 記録から描き直す（新しいセッションは、この時点で初めて記録ができている）
        if (threadSource === 'none') { bubble('ai', m.text); localPush('ai', m.text); }
      }
      if (muted) return; // 読み上げないので、読んでいる印はつけない
      const ai = $('log').querySelectorAll('.msg.ai'); speakingEl = ai[ai.length - 1] || null; if (speakingEl) speakingEl.classList.add('speaking');
    }
    else if (m.type === 'speaking') { accepting = !muted; serverDone = false; } // 切っている間に届いた音声は鳴らさない（本体も送らないが、切った直後の分が届くことがある）
    else if (m.type === 'error') { sys('⚠ ' + m.text); if (m.saved === false) sys('⚠ このやり取りは記録に書けませんでした（開き直すと消えます。本体のログを見てください）'); setStatus(''); if (m.gone) { agentsSig = ''; loadAgents(); } } // 相手が消えた・入れ替わった → 一覧を取り直す
    else if (m.type === 'notice') { sys('⚠ ' + m.text); if (m.saved === false) sys('⚠ このやり取りは記録に書けませんでした（開き直すと消えます。本体のログを見てください）'); } // ハブから報告を受け取れなかった等（いまの話し相手とは別の知らせ）
    else if (m.type === 'done') { serverDone = true; if (!playing && !queue.length) finishSpeaking(); loadAgents(); }
    else if (m.type === 'stopped') { stopPlayback(); setStatus('止めました'); }
    else if (m.type === 'blocked') loadAsks(); // 話している相手が承認で止まった → すぐ並べる
  };
}
function linked() { return !!ws && ws.readyState === 1; }
// 届かなかった間に変わったもの（一覧・声・会話）を取り直す
async function catchUp() {
  await ensureSpeakers();
  agentsSig = ''; shownPane = null; // 一覧と履歴を描き直させる
  await loadAgents();
  loadAsks();
}
// 声の一覧がまだ無ければ読む。読めなければ、つながっている間は3秒ごとに読み直す（重ねて読みに行かない）
let speakersBusy = false;
async function ensureSpeakers() {
  if (speakersBusy || $('speaker').options.length) return;
  speakersBusy = true;
  try { await loadSpeakers(); } catch { setTimeout(() => { if (linked()) ensureSpeakers(); }, 3000); } finally { speakersBusy = false; }
}
function sendTurnStart() { stopPlayback(); serverDone = true; }

// ---------- 録音（タップ→話す→タップ） ----------
async function startRec() {
  if (playing || queue.length) { ws.send(JSON.stringify({ type: 'stop' })); stopPlayback(); } // 話し始めたら相手の声は止める
  prime();
  setSession('play-and-record');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { setSession('auto'); stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  if (!linked()) { stream.getTracks().forEach(t => t.stop()); setSession('playback'); setStatus(UNREACHABLE); return; } // マイクの許可を待つ間に届かなくなった
  for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']) if (MediaRecorder.isTypeSupported(m)) { mime = m; break; }
  ext = mime.includes('mp4') ? 'mp4' : 'webm';
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    setSession('playback'); // マイクを離したら再生用に戻す（受話口から小さく鳴るのを防ぐ）
    if (!linked()) { setStatus(UNREACHABLE); return; } // 話しているあいだに届かなくなった（短い録音でも、こちらの案内を残す）
    const blob = new Blob(chunks, { type: mime || 'audio/webm' });
    if (blob.size < 2000) { setStatus('短すぎました'); return; }
    sendTurnStart();
    if (!$('agent').value) { setStatus('話し相手を選んでください'); return; }
    ws.send(JSON.stringify({ type: 'turn', pane: $('agent').value, key: curKey(), speaker: $('speaker').value, filename: 'rec.' + ext }));
    ws.send(await blob.arrayBuffer());
    setStatus('聞き取り中…');
  };
  rec.start();
  $('talk').classList.add('rec'); $('talk').textContent = '話してください（タップで送る）';
}
function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); $('talk').classList.remove('rec'); $('talk').textContent = 'タップして話す'; }

$('talk').onclick = () => { if (!$('agent').value) return; if (rec && rec.state === 'recording') stopRec(); else startRec().catch(e => { setStatus('マイクが使えません: ' + e.message); clog('mic failed: ' + e.name + ' ' + e.message); }); };
$('stop').onclick = () => { if (linked()) ws.send(JSON.stringify({ type: 'stop' })); stopPlayback(); setStatus('止めました'); };
$('typedForm').onsubmit = e => {
  e.preventDefault(); const t = $('typed').value.trim(); if (!t || !$('agent').value || !linked()) return; // 届かない間は打った文をそのまま残す
  sendTurnStart(); prime();
  $('typed').value = ''; bubble('me', t, 'pending'); localPush('me', t);
  ws.send(JSON.stringify({ type: 'text', text: t, pane: $('agent').value, key: curKey(), speaker: $('speaker').value }));
  setStatus('エージェントに送りました。考え中…');
};

// ---------- 起動 ----------
setSession('playback');
applyTarget(); // つながるまでは話す・送るを押せないようにしておく
// ホーム画面から開いたときはブラウザの読み込み直しが無いので、「↻」で最新の画面に替える。
// sw.js が扱わない道（/static/index.html）で本体から直に取り、写しの / を入れ替え終えてから読み込み直す
// （遅くて写しで答えられても最新になる）。取れない・入れられないときは、今の画面のまま案内を出す
$('reload').onclick = async () => {
  $('reload').disabled = true; setStatus('読み込み直しています…');
  const stop = new AbortController(), timer = setTimeout(() => stop.abort(), 10000); // 返事が無いときは見切る
  try {
    const res = await fetch('/static/index.html', { cache: 'no-store', signal: stop.signal });
    if (res.status !== 200 || res.redirected) throw new Error(res.status);
    const shell = await window.caches?.open('voice-loop-shell-v1'); // sw.js の CACHE と同じ名前
    await (shell ? shell.put('/', res) : res.text()); // 最後まで受け取って写しに入れ終える
    location.reload();
  } catch { $('reload').disabled = false; setStatus(UNREACHABLE); }
  finally { clearTimeout(timer); }
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {}); // Mac に届かなくても画面は開けるように（sw.js）
preparePush(); // 通知（🔔）の用意。sw.js が動きだしてから
setInterval(() => { if (!document.hidden) hello(); }, 20000); // 見えている間は知らせ直す（裏に回ったことが届かなくても、本体は45秒で見えていないとみなす）
window.addEventListener('pagehide', () => hello(false)); // 閉じる・裏に回るときに「見えていない」を知らせる
document.addEventListener('visibilitychange', () => { hello(); if (!document.hidden) { connect(); ensureSpeakers(); loadAgents().then(() => { if ($('agent').value) loadThread(); }); } });
window.addEventListener('online', () => connect());
setInterval(() => { if (!document.hidden && document.activeElement !== $('agent')) { loadAgents(); ensureSpeakers(); } }, 20000);
setInterval(() => { if (!document.hidden) loadAsks(); }, 5000); // 承認で止まっているセッションを、話し相手の画面のまま上に並べる
loadAsks();
// 一覧と声を読んでからつなぐ。届かないときは5秒で見切って案内を出し、つなぎに行く（つながりしだい catchUp で取り直す）
Promise.race([Promise.allSettled([loadAgents(), ensureSpeakers()]).then(() => true), new Promise(r => setTimeout(() => r(false), 5000))])
  .then(replied => { if (!replied) setStatus(UNREACHABLE); connect(); });
</script>
